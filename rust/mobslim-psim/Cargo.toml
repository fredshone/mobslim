[package]
name = "mobslim-psim"
version = "0.1.0"
edition = "2021"
description = "Compiled kernel for mobslim's PSim (whole-second queue mobsim on several threads)"
publish = false

[lib]
name = "mobslim_psim"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"

[profile.release]
lto = "fat"
codegen-units = 1
