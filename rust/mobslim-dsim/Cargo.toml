[package]
name = "mobslim-dsim"
version = "0.1.0"
edition = "2021"
description = "Compiled kernel for mobslim's DSim (partitioned workers exchanging messages with neighbours, as matsim-rust)"
publish = false

[lib]
name = "mobslim_dsim"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"

[profile.release]
lto = "fat"
codegen-units = 1
