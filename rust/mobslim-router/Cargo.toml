[package]
name = "mobslim-router"
version = "0.1.0"
edition = "2021"
description = "Compiled routers for mobslim (time-dependent Dijkstra and ALT)"
publish = false

[lib]
name = "mobslim_router"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"

[profile.release]
lto = "fat"
codegen-units = 1
